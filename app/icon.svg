  <!--
    Tab-Symbol.

    Vorher stand hier ein nachgezeichnetes Wappen. Das hier ist das echte,
    vereinfachte Vereinszeichen aus den Vorlagen des Vereins
    (Wappen_SVF_vereinfacht_schwarz.svg), eingepasst mit Faktor 0.3640.

    Auf gelbem Kreis, damit es in hellen wie in dunklen Browser-Themen sichtbar
    bleibt. Ein reines schwarzes Zeichen verschwindet in dunklen Tableisten, ein
