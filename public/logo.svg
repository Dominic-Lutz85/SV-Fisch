<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="svFischLogoTitle">
  <title id="svFischLogoTitle">Wappen SV Fisch 1964 e.V.</title>

  <!-- Äußerer Rondell: Schwarz mit gelbem Doppelring -->
  <circle cx="100" cy="100" r="98" fill="#0A0A0A" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="#F3DA0B" stroke-width="6" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="#F3DA0B" stroke-width="2" />

  <!-- Bogentext -->
  <defs>
    <path id="arcTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
    <path id="arcBottom" d="M 172 108 A 72 72 0 0 1 28 108" fill="none" />
  </defs>
  <text fill="#F6F6F6" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="19" letter-spacing="2">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">SV FISCH</textPath>
  </text>
  <text fill="#F6F6F6" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="19" letter-spacing="2">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">1964</textPath>
  </text>

  <!-- Innerer Kreis: Gelb mit schwarzem Rand -->
  <circle cx="100" cy="100" r="52" fill="#0A0A0A" />
  <circle cx="100" cy="100" r="48" fill="#F3DA0B" />

  <!-- Stilisierter Fisch -->
  <circle cx="76" cy="80" r="6" fill="#0A0A0A" />
  <path
    d="M 62 92 C 58 104 66 118 80 122 C 74 112 76 100 86 94 C 94 90 96 100 90 104 C 100 100 100 88 90 84 C 80 80 68 82 62 92 Z"
    fill="#0A0A0A"
  />

  <!-- Großes "F" -->
  <text x="112" y="128" fill="#0A0A0A" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="70" text-anchor="middle">F</text>
</svg>
