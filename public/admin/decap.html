<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Inhalte pflegen (Vergleichsfassung) &middot; SV Fisch</title>
    <!--
      VERGLEICHSFASSUNG, 09.09.2026. Nicht die richtige Oberflaeche.
      Die liegt in index.html daneben.

      Anlass: Sveltia CMS gibt es nur auf Englisch und Japanisch. Die
      Feldbeschriftungen kommen aus config.yml und sind deutsch, aber die
      Knoepfe drumherum ("Save", "Publish", "New") nicht. Decap CMS, der
      aeltere Vorgaenger, bringt eine deutsche Oberflaeche mit, wird dafuer
      aber kaum noch gepflegt.

      Beide lesen DIESELBE config.yml. Deshalb laesst sich der Unterschied
      hier nebeneinander ansehen, statt ihn zu beschreiben. Nach der
      Entscheidung fliegt eine der beiden Dateien raus.
    -->
    <!--
      Die deutsche Oberflaeche kommt allein aus "locale: de" in der
      config.yml. Ein eigenes CMS.registerLocale() stand hier zuerst und war
      unnoetig: Im Bundle laeuft beim Laden eine Schleife, die alle
      mitgelieferten Sprachen selbst registriert. Nachgesehen im Quelltext
      von decap-cms.js, nicht vermutet.
    -->
  </head>
  <body>
    <!--
      Das Skript steht im BODY und nicht im HEAD.

      Im Head geladen brach es mit
      "Cannot read properties of null (reading 'appendChild')" ab: Decap
      haengt sich beim Start an ein Element im Body, und den gibt es zu dem
      Zeitpunkt noch nicht. In der Konsole stand vorher trotzdem
      "decap-cms-app 3.16.1", das Skript war also da und nur zu frueh.
      Sveltia im Nachbarordner ist das egal, es wartet von selbst.
    -->
    <script src="https://unpkg.com/decap-cms@3.16.1/dist/decap-cms.js"></script>
  </body>
</html>
